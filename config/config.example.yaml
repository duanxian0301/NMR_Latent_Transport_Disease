# This file documents path-to-environment-variable mappings.
# The analytical scripts read the environment variables directly.

project_root:
  env: NMR_GFA_PROJECT_ROOT
  example: /path/to/NMR_Latent_Transport_Disease

ldsc:
  root_env: LDSC_ROOT
  eur_ld_scores_env: LDSC_EUR_LD_DIR
  example_root: /path/to/ldsc
  example_eur_ld_scores: /path/to/ldsc/eur_w_ld_chr

plink:
  executable_env: PLINK_EXECUTABLE
  european_reference_prefix_env: PLINK_EUR_BFILE
  example_executable: plink
  example_reference_prefix: /path/to/1000g/g1000_eur

factorgo:
  executable_env: FACTORGO_EXECUTABLE
  example: factorgo

lava:
  r_library_env: LAVA_R_LIBRARY
  locus_file_env: LAVA_LOCUS_FILE
  ukb_reference_directory_env: LAVA_UKB_REFERENCE_DIR
  ukb_reference_prefix_env: LAVA_UKB_REFERENCE_PREFIX
  example_r_library: /path/to/LAVA/R_library_0.1.5
  example_locus_file: /path/to/LAVA/blocks_s2500_m25_f1_w200.GRCh37_hg19.locfile
  example_reference_prefix: /path/to/LAVA/reference_ukb_v1.1/selected/lava-ukb-v1.1

optional_audit_mirror:
  env: NMR_GFA_AUDIT_MIRROR
  purpose: Optional second copy of audit outputs; defaults to the official audit output directory.

